   box.style.cssText='position:fixed;left:0;top:0;right:0;bottom:0;z-index:2147483647;overflow:auto;background:#240008;color:#fff;font:bold 20px/1.4 Arial,sans-serif;padding:20px;white-space:pre-wrap;word-wrap:break-word;-webkit-user-select:text;user-select:text';

<title>AVIDAA Pulse</title>
<style>
:root{--sa-t:env(safe-area-inset-top,0px);--sa-r:env(safe-area-inset-right,0px);--sa-b:env(safe-area-inset-bottom,0px);--sa-l:env(safe-area-inset-left,0px)}
:root{--bg:#050818;--ui:#050818;--fg:#e8edff;--acc:#2a4a9a;--font:system-ui,Segoe UI,Roboto,Arial,sans-serif;--line:rgba(128,150,255,.35)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050818;background:var(--ui);color:#e8edff;color:var(--fg);font:16px/1.4 system-ui,Segoe UI,Roboto,Arial,sans-serif;font-family:var(--font);overflow:hidden}
body{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;padding:var(--sa-t) var(--sa-r) var(--sa-b) var(--sa-l)}
header{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 14px;border-bottom:2px solid var(--line);flex:none}
.brand{display:inline-flex;align-items:center;gap:10px;color:inherit;text-decoration:none;min-height:44px}
.brand svg{width:40px;height:40px;flex:none}
.brand b{font-size:1.25rem;letter-spacing:.06em}
.brand span{font-size:1.1rem;opacity:.85}
#clock{margin-left:auto;font:700 .95rem/1.2 ui-monospace,Menlo,Consolas,monospace;text-align:right}
main{flex:1;min-height:0;display:flex;flex-direction:row}
#mapwrap{position:relative;flex:1;min-width:0;min-height:0}
#map{display:block;width:100%;height:100%;touch-action:none;outline:none;background:var(--bg)}
#map:focus{box-shadow:inset 0 0 0 3px #ffd93d}
.zoom{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:8px}
.zoom button{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--ui);color:var(--fg);font:700 22px/1 system-ui,sans-serif;cursor:pointer}
#panel{flex:none;width:min(400px,36vw);min-width:300px;display:flex;flex-direction:column;border-left:2px solid var(--line);background:var(--ui);min-height:0}
.lv{display:flex;gap:8px;padding:10px 12px 0}
.lv button,.tabs button,.tbtn{min-height:44px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--fg);font:700 .95rem/1.1 system-ui,sans-serif;font-family:var(--font);cursor:pointer}
.lv button{flex:1}
.lv button[aria-pressed=true],.tabs button[aria-selected=true]{background:var(--acc);color:var(--ui);border-color:var(--acc)}
.tabs{display:flex;gap:6px;padding:10px 12px;flex-wrap:wrap}
.tabs button{flex:1;min-width:70px}
section{overflow:auto;padding:0 12px 14px;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
button:focus,a:focus{outline:3px solid #ffd93d;outline-offset:2px}
#themes{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.tbtn{flex:1 1 28%;min-width:0;padding:8px 4px;font-size:.875rem}
.lrow{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:6px 10px;margin:0 0 6px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--fg);text-align:left;cursor:pointer;font-family:var(--font)}
.lrow.on{border-color:var(--acc);background:rgba(128,150,255,.12)}
.lrow .sw{width:18px;height:18px;border-radius:50%;flex:none}
.lrow .lt{flex:1;min-width:0;display:flex;flex-direction:column}
.lrow .lt b{font-size:.98rem}
.lrow .lt small{font-size:.875rem;opacity:.8;white-space:normal}
.lrow .cnt{font:700 1rem ui-monospace,Menlo,Consolas,monospace;min-width:34px;text-align:right}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.875rem;font-weight:800;border:2px solid currentColor;white-space:nowrap}
.chip.up{color:#2bb673}.chip.down{color:#ff5a6a}.chip.wait{color:#c0a000}.chip.ref{color:#6aa8ff}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:6px 4px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-family:ui-monospace,Menlo,Consolas,monospace}
tr.tot td{font-weight:800}
small{display:block;opacity:.8}.err{color:#ff8a8a;opacity:1}
.note{font-size:.9rem;opacity:.85;margin:10px 0 0}
h3{margin:8px 0;font-size:1.1rem;overflow-wrap:anywhere}
dl{margin:10px 0}dt{font-size:.875rem;opacity:.75;margin-top:8px}dd{margin:0;font-weight:700;overflow-wrap:anywhere}
a.lnk{display:inline-block;margin-right:12px;min-height:44px;line-height:44px;color:var(--acc);font-weight:800}
footer{flex:none;min-height:30px;padding:4px 14px;border-top:2px solid var(--line);font-size:.875rem;text-align:center;opacity:.9}
@media (max-aspect-ratio:1/1){
 main{flex-direction:column}
 #panel{width:100%;min-width:0;height:40%;max-height:40%;border-left:0;border-top:2px solid var(--line)}
 .tabs button{min-width:60px;padding:8px 6px}
 header{min-height:52px}
}
@media (min-width:1700px){html,body{font-size:20px}#panel{width:min(560px,32vw)}.lv button,.tabs button,.tbtn{font-size:1.1rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  /* ---------- engine ---------- */
  function build() {
    objs = [];
    var kinds = (THEME.kinds || ['fireflies']), budget = CAP;
    kinds.forEach(function (name) { var k = K[name]; if (!k) return; var n = Math.min(k.n, Math.max(1, Math.floor(budget / kinds.length))); for (var i = 0; i < n; i++) { var o = k.make(i); o.__k = k; objs.push(o); } });
    if (objs.length > CAP) objs.length = CAP;
  }
  function draw(t, still) {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < objs.length; i++) { var o = objs[i]; try { o.__k.draw(o, t); } catch (e) {} }
  }
  function frame(now) {
    raf = 0; if (!running) return;
    var s = performance.now(); var dt = Math.min(.05, (now - (last || now)) / 1000); last = now; var t = (now - t0) / 1000;
    pollPad(); if (ptr.on && now - ptr.t > 4000) ptr.on = 0;
    for (var i = 0; i < objs.length; i++) { var o = objs[i]; o.__k.step(o, dt, t, objs); }
    draw(t);

    if (ema > 3.2 && objs.length > 6) objs.length = Math.floor(objs.length * .8); /* stay under 4 ms per frame */
    window.__avLife.ms = ema; window.__avLife.n = objs.length; window.__avLife.frames++;

  }

  function pm(e) { ptr.x = e.clientX; ptr.y = e.clientY; ptr.on = 1; ptr.t = performance.now(); }
  function tm(e) { var t = e.touches && e.touches[0]; if (t) { ptr.x = t.clientX; ptr.y = t.clientY; ptr.on = 1; ptr.t = performance.now(); } }

  window.addEventListener('pointermove', pm, { passive: true }); window.addEventListener('pointerdown', pm, { passive: true });
  window.addEventListener('touchstart', tm, { passive: true }); window.addEventListener('touchmove', tm, { passive: true });
  window.addEventListener('resize', function () { size(); build(); if (reduced) draw(0, true); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); else start(); });
  /* if opaque page layers would hide a background canvas, show the creatures as a soft overlay instead (still never takes a click) */
  function placement() {
    try {
      var cov = 0, tot = 0;
      for (var gx = 1; gx < 6; gx++) for (var gy = 1; gy < 6; gy++) {
        var e = document.elementFromPoint(W * gx / 6, H * gy / 6); tot++;
        for (; e && e !== document.body && e !== document.documentElement; e = e.parentElement) {
          var cs = getComputedStyle(e), m = /rgba?\(([^)]*)\)/.exec(cs.backgroundColor || '');
          if (m) { var p = m[1].split(','); var a = p.length > 3 ? parseFloat(p[3]) : 1; if (a > .85) { cov++; break; } }
        }

  }

})();
